<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Teste</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="container">
        <h1>Gráfico de Temperatura e Umidade</h1>
    </div>
    
    
    <div id="grafico1">
      <canvas id="myChart"></canvas>
    </div>

    <div id="grafico2">
      <canvas id="myChart2"></canvas>
    </div>
  </body>

  <script>
    const ctx = document.getElementById("myChart");
    

    new Chart(ctx, {
      type: "line",
      data: {
        labels: ["12:00", "13:00", "14:00", "15:00", "16:00", "17:00"],
        datasets: [
          {
            label: "Temperatura",
            backgroundColor: "rgba(255, 70, 70, 0.15)",
            borderColor: "#ff4747",
            data: [30, 29, 28, 25, 22, 23],
            borderWidth: 1,
          },
          {
            label: "Umidade",
            backgroundColor: "rgba(50, 130, 255, 0.15)", 
            borderColor: "#3282ff",
            data: [80, 82, 80, 85, 80, 83],
            borderWidth: 1,
          }
        ],
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });
  </script>

  <script>
    const ctx2 = document.getElementById("myChart2");

    new Chart(ctx2, {
      type: "bar",
      data: {
        labels: ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho"],
        datasets: [
          {
            label: "Temperatura",
            backgroundColor: "#ff4747", 
            borderColor: "#ff4747",
            data: [22, 24, 27, 23, 20, 18],
            borderWidth: 1,
          },
          {
            label: "Umidade",
            backgroundColor: "#3282ff", 
            borderColor: "#3282ff",
            data: [90, 89, 93, 87, 88, 82],
            borderWidth: 1,
          }
        ],
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });
  </script>
</html>
